<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>問題演習・模擬試験ツール</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #1c1b19;
      --muted: #6b6a66;
      --accent: #1f6f8b;
      --accent-2: #f4a261;
      --card: #ffffff;
      --border: #e0ddd6;
      --ok: #2a9d8f;
      --ng: #e76f51;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
      background: radial-gradient(circle at 20% 20%, #ffffff, var(--bg));
      color: var(--ink);
    }
    header {
      padding: 28px 20px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(120deg, #fdf5e6 0%, #f7efe5 50%, #eef4f7 100%);
    }
    header h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    main {
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.03);
    }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fffdf8;
    }
    label {
      font-size: 14px;
      color: var(--muted);
    }
    select, input[type="number"], button {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      background: #fff;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button.secondary {
      background: #e9ecef;
      color: var(--ink);
      border: 1px solid var(--border);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .question {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: #fff;
    }
    .question h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    .options label {
      display: block;
      margin: 6px 0;
      color: var(--ink);
      white-space: pre-wrap;
    }
    .key-tag {
      margin-left: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      margin-left: 6px;
    }
    .badge.ok { background: rgba(42,157,143,0.15); color: var(--ok); }
    .badge.ng { background: rgba(231,111,81,0.15); color: var(--ng); }
    .json-block {
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      overflow: auto;
    }
    .muted { color: var(--muted); }
    .hidden { display: none; }
    .prewrap { white-space: pre-wrap; }

    @media (max-width: 720px) {
      header { padding: 20px 16px 14px; }
      header h1 { font-size: 18px; }
      main { padding: 14px; }
      .panel { padding: 12px; }
      .row { gap: 8px; }
      .row label { width: 100%; }
      select, input[type="number"], input[type="file"], button {
        width: 100%;
      }
      #examCountWrap { width: 100%; }
      .question { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>問題演習・模擬試験ツール</h1>
    <p>任意の問題JSONを読み込み、練習モード / 模擬試験モードで解けます。</p>
  </header>
  <main>
    <div class="panel">
      <label for="jsonFile">問題JSONファイルを選択</label>
      <div class="row" style="margin-top:8px;">
        <input id="jsonFile" type="file" accept=".json,application/json" multiple />
        <span class="muted" id="parseStatus"></span>
      </div>
      <p class="muted" style="margin:8px 0 0;">JSONは複数選択できます。選択すると自動で読み込みます。</p>
    </div>

    <div class="panel">
      <div class="row">
        <label>モード</label>
        <select id="modeSelect">
          <option value="practice">練習モード</option>
          <option value="exam">模擬試験モード</option>
        </select>
        <span id="examCountWrap" class="row" style="gap:6px;">
          <label for="examCount">問題数</label>
          <input id="examCount" type="number" min="1" value="100" />
        </span>
        <label for="rangeStart">開始</label>
        <input id="rangeStart" type="number" min="1" value="1" />
        <label for="rangeEnd">終了</label>
        <input id="rangeEnd" type="number" min="1" value="1" />
        <div class="row" style="width:100%; margin-top:6px;">
          <label for="specificMode">
            <input id="specificMode" type="checkbox" />
            特定問題だけを出題
          </label>
        </div>
        <div class="row" id="specificInputWrap" style="width:100%; margin-top:6px; display:none;">
          <input id="specificInput" type="text" placeholder="例: 101,102 または SnowProCore(JPNtest).json#34" />
        </div>
        <div class="row" style="width:100%; margin-top:6px;">
          <label for="randomOrder">
            <input id="randomOrder" type="checkbox" />
            出題順をランダム
          </label>
        </div>
        <div class="row" style="width:100%; margin-top:6px;">
          <label for="randomOptions">
            <input id="randomOptions" type="checkbox" />
            選択肢をランダム
          </label>
        </div>
        <div class="row" style="width:100%; margin-top:6px;">
          <button id="startBtn" class="secondary">開始</button>
        </div>
      </div>
      <p class="muted" style="margin:8px 0 0;">模擬試験モードでは最期に正誤判定し、間違いのみ表示します。</p>
    </div>

    <div class="panel">
      <div class="row" style="justify-content: space-between;">
        <h2 style="margin:0; font-size:16px;">出題</h2>
        <label for="showKey">
          <input id="showKey" type="checkbox" />
          keyを表示
        </label>
      </div>
      <div id="quizArea" style="margin-top:8px;"></div>
    </div>

    <div class="panel">
      <div class="row" style="justify-content: space-between;">
        <h2 style="margin:0; font-size:16px;">JSONブロック（1問ずつ）</h2>
        <label for="showJson">
          <input id="showJson" type="checkbox" />
          表示する
        </label>
      </div>
      <div id="jsonBlocks" class="grid hidden" style="margin-top:8px;"></div>
    </div>
  </main>

  <script>
    const jsonFile = document.getElementById('jsonFile');
    const parseStatus = document.getElementById('parseStatus');
    const jsonBlocks = document.getElementById('jsonBlocks');
    const showJson = document.getElementById('showJson');
    const modeSelect = document.getElementById('modeSelect');
    const examCount = document.getElementById('examCount');
    const examCountWrap = document.getElementById('examCountWrap');
    const rangeStart = document.getElementById('rangeStart');
    const rangeEnd = document.getElementById('rangeEnd');
    const randomOrder = document.getElementById('randomOrder');
    const randomOptions = document.getElementById('randomOptions');
    const specificMode = document.getElementById('specificMode');
    const specificInput = document.getElementById('specificInput');
    const specificInputWrap = document.getElementById('specificInputWrap');
    const startBtn = document.getElementById('startBtn');
    const quizArea = document.getElementById('quizArea');
    const showKey = document.getElementById('showKey');

    let questions = [];
    let activeSession = null;
    let sessionSeq = 0;

    function setShuffleControlsLocked(_locked) {
      // no-op: 設定変更は許可し、次回開始時にのみ反映する
    }

    function startSessionSnapshot() {
      sessionSeq += 1;
      activeSession = {
        id: sessionSeq,
        randomOrder: !!randomOrder.checked,
        randomOptions: !!randomOptions.checked,
        optionOrderMap: new Map(),
      };
    }

    function buildUniqueFileLabels(files) {
      const counts = new Map();
      return files.map((file) => {
        const base = String(file.name || 'unknown.json');
        const next = (counts.get(base) || 0) + 1;
        counts.set(base, next);
        return next === 1 ? base : `${base}(${next})`;
      });
    }

    function normalizeLoadedQuestion(raw, sourceFile, localIndex) {
      const q = (raw && typeof raw === 'object') ? raw : {};
      const localNumber = Number.isFinite(q.number) ? q.number : (localIndex + 1);
      return {
        ...q,
        sourceFile,
        originNumber: localNumber,
      };
    }

    function applyLoadedQuestionSets(fileEntries) {
      const merged = [];
      fileEntries.forEach((entry) => {
        const list = Array.isArray(entry.data) ? entry.data : [];
        list.forEach((raw, idx) => {
          merged.push(normalizeLoadedQuestion(raw, entry.label, idx));
        });
      });
      questions = merged.map((q, idx) => ({
        ...q,
        number: idx + 1,
      }));
      activeSession = null;
      renderJsonBlocks(questions);
      const max = Math.max(questions.length, 1);
      rangeStart.value = 1;
      rangeEnd.value = max;
      rangeEnd.max = max;
      rangeStart.max = max;
      const labels = fileEntries.map((entry) => entry.label);
      const preview = labels.slice(0, 3).join(', ');
      const suffix = labels.length > 3 ? ` ほか${labels.length - 3}件` : '';
      parseStatus.textContent = `${labels.length}ファイル 読み込み完了: ${questions.length}問 (${preview}${suffix})`;
    }

    function handleLoadError(message) {
      parseStatus.textContent = message;
      questions = [];
      activeSession = null;
      renderJsonBlocks([]);
      rangeStart.value = 1;
      rangeEnd.value = 1;
      rangeStart.max = 1;
      rangeEnd.max = 1;
      setShuffleControlsLocked(false);
    }

    function renderJsonBlocks(list) {
      jsonBlocks.innerHTML = '';
      if (!showJson.checked) return;
      for (const q of list) {
        const pre = document.createElement('pre');
        pre.className = 'json-block';
        pre.textContent = JSON.stringify(q, null, 2);
        jsonBlocks.appendChild(pre);
      }
    }

    const DISPLAY_KEYS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    function getOptionOrderKey(q, idx) {
      return q.number ?? `idx_${idx}`;
    }

    function normalizeOptionKey(option, idx) {
      const raw = (typeof option === 'string')
        ? option
        : (option && typeof option === 'object' ? option.key : '');
      const key = String(raw ?? '').trim().toUpperCase();
      return key || DISPLAY_KEYS[idx] || String(idx + 1);
    }

    function getNormalizedOptions(q) {
      const original = Array.isArray(q.options) ? q.options : [];
      return original.map((opt, i) => ({
        key: normalizeOptionKey(opt, i),
        text: (opt && typeof opt === 'object' && opt.text != null) ? String(opt.text) : ''
      }));
    }

    function getDisplayOptions(q, idx) {
      const original = getNormalizedOptions(q);
      const useRandomOptions = !!(activeSession && activeSession.randomOptions);
      if (!useRandomOptions) {
        return original.map((opt, i) => ({
          displayKey: opt.key || DISPLAY_KEYS[i],
          originalKey: opt.key || DISPLAY_KEYS[i],
          text: opt.text
        }));
      }
      const orderMap = activeSession.optionOrderMap;
      const key = getOptionOrderKey(q, idx);
      if (!orderMap.has(key)) {
        const shuffled = original.slice();
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        orderMap.set(key, shuffled);
      }
      const shuffled = orderMap.get(key);
      return shuffled.map((opt, i) => ({
        displayKey: DISPLAY_KEYS[i] ?? opt.key,
        originalKey: opt.key,
        text: opt.text
      }));
    }

    function buildOptionLabel(opt) {
      if (opt.text && opt.text.trim().length > 0) {
        return ` ${opt.displayKey}. ${opt.text}`;
      }
      return ` ${opt.displayKey}`;
    }

    function getDisplayAnswerKeys(q, displayOptions) {
      const answers = new Set(
        (Array.isArray(q.answer) ? q.answer : [])
          .map((value) => String(value ?? '').trim().toUpperCase())
          .filter(Boolean)
      );
      const display = [];
      for (const opt of displayOptions) {
        if (answers.has(opt.originalKey)) {
          display.push(opt.displayKey);
        }
      }
      return display;
    }

    function getQuestionNumber(q, fallback) {
      return Number.isFinite(q.number) ? q.number : fallback;
    }

    function getQuestionRef(q, fallbackNumber) {
      const localNumber = Number.isFinite(q.originNumber)
        ? q.originNumber
        : getQuestionNumber(q, fallbackNumber);
      const sourceFile = String(q.sourceFile || '').trim();
      if (sourceFile && Number.isFinite(localNumber)) {
        return `${sourceFile}#${localNumber}`;
      }
      if (Number.isFinite(localNumber)) {
        return String(localNumber);
      }
      return '';
    }

    function normalizeRefToken(token) {
      const raw = String(token || '').trim();
      if (!raw) return '';
      const hash = raw.match(/^(.+?)[#＃]\s*(\d+)$/);
      if (hash) {
        return `${hash[1].trim()}#${parseInt(hash[2], 10)}`;
      }
      const colon = raw.match(/^(.+?)[:：]\s*(\d+)$/);
      if (colon) {
        return `${colon[1].trim()}#${parseInt(colon[2], 10)}`;
      }
      return raw;
    }

    function setQuestionTitle(h3, displayIndex, qNumber, qRef) {
      h3.className = 'question-title';
      h3.dataset.displayIndex = displayIndex;
      h3.dataset.qNumber = qNumber ?? '';
      h3.dataset.qRef = qRef ?? '';
      h3.textContent = `問題${displayIndex}`;
      const keyLabel = qRef || qNumber;
      if (showKey.checked && keyLabel !== undefined && keyLabel !== null && keyLabel !== '') {
        const span = document.createElement('span');
        span.className = 'key-tag';
        span.textContent = `(${keyLabel})`;
        h3.appendChild(span);
      }
    }

    function refreshQuestionTitles() {
      document.querySelectorAll('.question-title').forEach((el) => {
        const displayIndex = el.dataset.displayIndex || '';
        const qNumber = el.dataset.qNumber || '';
        const qRef = el.dataset.qRef || '';
        el.textContent = `問題${displayIndex}`;
        const keyLabel = qRef || qNumber;
        if (showKey.checked && keyLabel !== '') {
          const span = document.createElement('span');
          span.className = 'key-tag';
          span.textContent = `(${keyLabel})`;
          el.appendChild(span);
        }
      });
    }

    function renderWrongListUI(container, incorrectRefs) {
      if (!incorrectRefs || incorrectRefs.length === 0) return;
      const wrap = document.createElement('div');
      wrap.style.marginTop = '10px';
      const btn = document.createElement('button');
      btn.textContent = '間違えた問題IDを出力';
      btn.className = 'secondary';
      const box = document.createElement('textarea');
      box.className = 'hidden';
      box.readOnly = true;
      box.style.marginTop = '8px';
      box.value = incorrectRefs.join(', ');
      btn.onclick = () => {
        box.classList.remove('hidden');
      };
      wrap.appendChild(btn);
      wrap.appendChild(box);
      container.appendChild(wrap);
    }

    function renderPractice(list) {
      quizArea.innerHTML = '';
      if (list.length === 0) {
        quizArea.textContent = '問題がありません。';
        return;
      }
      let idx = 0;
      const incorrectSet = new Set();
      const answerState = new Map();

      const container = document.createElement('div');
      container.className = 'question';
      quizArea.appendChild(container);

      function showQuestion() {
        const q = list[idx];
        container.innerHTML = '';
        const h3 = document.createElement('h3');
        const qNumber = getQuestionNumber(q, idx + 1);
        const qRef = getQuestionRef(q, qNumber);
        setQuestionTitle(h3, idx + 1, qNumber, qRef);
        container.appendChild(h3);

        const p = document.createElement('p');
        p.className = 'prewrap';
        p.textContent = q.question;
        container.appendChild(p);

        const opts = document.createElement('div');
        opts.className = 'options';
        const displayOptions = getDisplayOptions(q, idx);
        for (const opt of displayOptions) {
          const label = document.createElement('label');
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.name = `q_${idx}`;
          cb.value = opt.displayKey;
          label.appendChild(cb);
          label.appendChild(document.createTextNode(buildOptionLabel(opt)));
          opts.appendChild(label);
        }
        container.appendChild(opts);

        const btnRow = document.createElement('div');
        btnRow.className = 'row';
        btnRow.style.marginTop = '10px';
        const submitBtn = document.createElement('button');
        submitBtn.textContent = '回答する';
        const prevBtn = document.createElement('button');
        prevBtn.textContent = '前へ';
        prevBtn.className = 'secondary';
        prevBtn.disabled = idx === 0;
        const nextBtn = document.createElement('button');
        nextBtn.textContent = '次へ';
        nextBtn.className = 'secondary';
        nextBtn.disabled = true;
        btnRow.appendChild(prevBtn);
        btnRow.appendChild(submitBtn);
        btnRow.appendChild(nextBtn);
        container.appendChild(btnRow);

        const result = document.createElement('div');
        result.style.marginTop = '10px';
        container.appendChild(result);

        const state = answerState.get(idx);
        if (state) {
          for (const cb of container.querySelectorAll('input[type=checkbox]')) {
            cb.checked = state.selectedKeys.includes(cb.value);
            cb.disabled = true;
          }
          result.innerHTML = '';
          const badge = document.createElement('span');
          badge.className = `badge ${state.correct ? 'ok' : 'ng'}`;
          badge.textContent = state.correct ? '正解' : '不正解';
          result.appendChild(badge);
          const ans = document.createElement('p');
          ans.textContent = `解答: ${state.correctKeys.join(', ') || '未設定'}`;
          result.appendChild(ans);
          const exp = document.createElement('p');
          exp.className = 'prewrap';
          exp.textContent = `解説:\n${q.explanation}`;
          result.appendChild(exp);
          submitBtn.disabled = true;
          nextBtn.disabled = false;
        }

        submitBtn.onclick = () => {
          const selected = Array.from(container.querySelectorAll('input[type=checkbox]:checked')).map(el => el.value);
          const correctKeys = getDisplayAnswerKeys(q, displayOptions);
          const correct = correctKeys.sort().join(',') === selected.sort().join(',');
          if (!correct) {
            incorrectSet.add(getQuestionRef(q, getQuestionNumber(q, idx + 1)));
          }
          answerState.set(idx, { selectedKeys: selected, correctKeys, correct });
          for (const cb of container.querySelectorAll('input[type=checkbox]')) {
            cb.disabled = true;
          }
          result.innerHTML = '';
          const badge = document.createElement('span');
          badge.className = `badge ${correct ? 'ok' : 'ng'}`;
          badge.textContent = correct ? '正解' : '不正解';
          result.appendChild(badge);
          const ans = document.createElement('p');
          ans.textContent = `解答: ${correctKeys.join(', ') || '未設定'}`;
          result.appendChild(ans);
          const exp = document.createElement('p');
          exp.className = 'prewrap';
          exp.textContent = `解説:\n${q.explanation}`;
          result.appendChild(exp);
          submitBtn.disabled = true;
          nextBtn.disabled = false;
        };

        prevBtn.onclick = () => {
          if (idx === 0) return;
          idx -= 1;
          showQuestion();
        };

        nextBtn.onclick = () => {
          idx += 1;
          if (idx >= list.length) {
            container.innerHTML = '<p>完了しました。</p>';
            const wrongRefs = Array.from(incorrectSet);
            if (wrongRefs.length > 0) {
              renderWrongListUI(container, wrongRefs);
            }
            return;
          }
          showQuestion();
        };
      }

      showQuestion();
    }

    function renderExam(list, count) {
      quizArea.innerHTML = '';
      if (list.length === 0) {
        quizArea.textContent = '問題がありません。';
        return;
      }
      const selected = list.slice(0, count);

      const form = document.createElement('div');
      form.className = 'grid';
      quizArea.appendChild(form);

      selected.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question';
        const h3 = document.createElement('h3');
        const qNumber = getQuestionNumber(q, idx + 1);
        const qRef = getQuestionRef(q, qNumber);
        setQuestionTitle(h3, idx + 1, qNumber, qRef);
        card.appendChild(h3);
        const p = document.createElement('p');
        p.className = 'prewrap';
        p.textContent = q.question;
        card.appendChild(p);
        const opts = document.createElement('div');
        opts.className = 'options';
        const displayOptions = getDisplayOptions(q, idx);
        for (const opt of displayOptions) {
          const label = document.createElement('label');
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.name = `q_${idx}`;
          cb.value = opt.displayKey;
          label.appendChild(cb);
          label.appendChild(document.createTextNode(buildOptionLabel(opt)));
          opts.appendChild(label);
        }
        card.appendChild(opts);
        form.appendChild(card);
      });

      const submitBtn = document.createElement('button');
      submitBtn.textContent = '採点する';
      submitBtn.style.marginTop = '12px';
      quizArea.appendChild(submitBtn);

      const result = document.createElement('div');
      result.style.marginTop = '12px';
      quizArea.appendChild(result);

      submitBtn.onclick = () => {
        const incorrect = [];
        selected.forEach((q, idx) => {
          const selectedKeys = Array.from(form.querySelectorAll(`input[name=q_${idx}]:checked`)).map(el => el.value);
          const displayOptions = getDisplayOptions(q, idx);
          const correctKeys = getDisplayAnswerKeys(q, displayOptions);
          const correct = correctKeys.sort().join(',') === selectedKeys.sort().join(',');
          if (!correct) {
            incorrect.push({ q, selectedKeys, correctKeys, displayIndex: idx + 1 });
          }
        });

        result.innerHTML = '';
        const correctCount = selected.length - incorrect.length;
        const score = (correctCount / selected.length) * 100;
        const summary = document.createElement('p');
        summary.textContent = `正解数: ${correctCount} / ${selected.length}`;
        result.appendChild(summary);
        const scoreLine = document.createElement('p');
        scoreLine.textContent = `得点: ${score.toFixed(1)} / 100`;
        result.appendChild(scoreLine);

        if (incorrect.length === 0) {
          const allOk = document.createElement('p');
          allOk.textContent = '全問正解です。';
          result.appendChild(allOk);
          return;
        }

        const wrongRefs = incorrect.map(item => getQuestionRef(item.q, getQuestionNumber(item.q, item.displayIndex)));
        renderWrongListUI(result, wrongRefs);

        const list = document.createElement('div');
        list.className = 'grid';
        incorrect.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'question';
          const h3 = document.createElement('h3');
          const qNumber = getQuestionNumber(item.q, item.displayIndex);
          const qRef = getQuestionRef(item.q, qNumber);
          setQuestionTitle(h3, item.displayIndex, qNumber, qRef);
          card.appendChild(h3);
          const p = document.createElement('p');
          p.textContent = item.q.question;
          card.appendChild(p);
          const ua = document.createElement('p');
          ua.textContent = `あなたの回答: ${item.selectedKeys.join(', ') || '未回答'}`;
          card.appendChild(ua);
          const ans = document.createElement('p');
          ans.textContent = `解答: ${item.correctKeys.join(', ') || '未設定'}`;
          card.appendChild(ans);
          const exp = document.createElement('p');
          exp.className = 'prewrap';
          exp.textContent = `解説:\n${item.q.explanation}`;
          card.appendChild(exp);
          list.appendChild(card);
        });
        result.appendChild(list);
      };
    }

    function readFileText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error(`ファイルの読み込みに失敗しました: ${file.name}`));
        reader.readAsText(file, 'utf-8');
      });
    }

    async function loadSelectedFiles() {
      const files = Array.from(jsonFile.files || []);
      if (files.length === 0) {
        handleLoadError('JSONファイルを選択してください。');
        return;
      }
      const labels = buildUniqueFileLabels(files);
      const fileEntries = [];
      for (let i = 0; i < files.length; i += 1) {
        const file = files[i];
        const label = labels[i];
        try {
          const text = (await readFileText(file)).replace(/^\uFEFF/, '').trim();
          const data = JSON.parse(text);
          fileEntries.push({ label, data });
        } catch (e) {
          handleLoadError(`JSON読み込み失敗 (${file.name}): ${e.message}`);
          return;
        }
      }
      applyLoadedQuestionSets(fileEntries);
      setShuffleControlsLocked(false);
    }

    jsonFile.onchange = () => {
      loadSelectedFiles();
    };

    showKey.onchange = () => {
      refreshQuestionTitles();
    };

    showJson.onchange = () => {
      if (showJson.checked) {
        jsonBlocks.classList.remove('hidden');
        renderJsonBlocks(questions);
      } else {
        jsonBlocks.classList.add('hidden');
        jsonBlocks.innerHTML = '';
      }
    };

    function updateSpecificUI() {
      const enabled = specificMode.checked;
      specificInputWrap.style.display = enabled ? 'flex' : 'none';
      rangeStart.disabled = enabled;
      rangeEnd.disabled = enabled;
    }

    specificMode.onchange = () => {
      updateSpecificUI();
    };

    function parseSpecificSelectors() {
      const raw = (specificInput.value || '').trim();
      if (!raw) return [];
      const tokens = raw
        .split(/[\n,]+/)
        .map(v => v.trim())
        .filter(Boolean);
      const unique = [];
      const seen = new Set();
      for (const token of tokens) {
        if (/^\d+$/.test(token)) {
          const n = parseInt(token, 10);
          const key = `n:${n}`;
          if (!seen.has(key)) {
            seen.add(key);
            unique.push({ type: 'number', value: n });
          }
          continue;
        }
        const ref = normalizeRefToken(token).toLowerCase();
        if (!ref) continue;
        const key = `r:${ref}`;
        if (!seen.has(key)) {
          seen.add(key);
          unique.push({ type: 'ref', value: ref });
        }
      }
      return unique;
    }

    function getSpecifiedQuestions(selectors) {
      if (selectors.length === 0) return [];
      const numberMap = new Map();
      const refMap = new Map();
      questions.forEach((q, idx) => {
        const n = getQuestionNumber(q, idx + 1);
        if (Number.isFinite(n) && !numberMap.has(n)) {
          numberMap.set(n, q);
        }
        const ref = normalizeRefToken(getQuestionRef(q, n)).toLowerCase();
        if (ref && !refMap.has(ref)) {
          refMap.set(ref, q);
        }
      });
      const picked = [];
      selectors.forEach((selector) => {
        if (selector.type === 'number') {
          const q = numberMap.get(selector.value);
          if (q) picked.push(q);
          return;
        }
        if (selector.type === 'ref') {
          const q = refMap.get(selector.value);
          if (q) picked.push(q);
        }
      });
      return picked;
    }

    function getRangeFilteredQuestions() {
      const total = questions.length;
      if (total === 0) return [];
      if (specificMode.checked) {
        const selectors = parseSpecificSelectors();
        return getSpecifiedQuestions(selectors);
      }
      let start = parseInt(rangeStart.value, 10);
      let end = parseInt(rangeEnd.value, 10);
      if (Number.isNaN(start)) start = 1;
      if (Number.isNaN(end)) end = total;
      start = Math.max(1, Math.min(start, total));
      end = Math.max(1, Math.min(end, total));
      if (start > end) [start, end] = [end, start];
      return questions.slice(start - 1, end);
    }

    function applyRandomOrder(list) {
      const useRandomOrder = !!(activeSession && activeSession.randomOrder);
      if (!useRandomOrder) return list;
      const shuffled = list.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    startBtn.onclick = () => {
      if (questions.length === 0) {
        parseStatus.textContent = '先に解析してください。';
        return;
      }
      const rangeList = getRangeFilteredQuestions();
      if (specificMode.checked && rangeList.length === 0) {
        parseStatus.textContent = '指定した問題番号/問題IDが見つかりません。';
        return;
      }
      startSessionSnapshot();
      setShuffleControlsLocked(true);
      const mode = modeSelect.value;
      if (mode === 'practice') {
        const useList = applyRandomOrder(rangeList);
        renderPractice(useList);
      } else {
        const count = Math.max(1, parseInt(examCount.value, 10) || 1);
        const limit = Math.min(count, rangeList.length);
        let useList;
        if (randomOrder.checked) {
          // random sample without replacement, and keep random order
          const pool = rangeList.slice();
          useList = [];
          while (useList.length < limit) {
            const i = Math.floor(Math.random() * pool.length);
            useList.push(pool.splice(i, 1)[0]);
          }
        } else {
          useList = rangeList.slice(0, limit);
        }
        renderExam(useList, limit);
      }
    };

    function updateModeUI() {
      const isExam = modeSelect.value === 'exam';
      examCountWrap.style.display = isExam ? 'flex' : 'none';
    }

    modeSelect.onchange = () => {
      updateModeUI();
    };

    updateModeUI();
    updateSpecificUI();
    setShuffleControlsLocked(false);
  </script>
</body>
</html>
